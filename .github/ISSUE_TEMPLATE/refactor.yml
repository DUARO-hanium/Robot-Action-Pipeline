name: 리팩토링
description: 코드 정리 또는 구조 개선 시 사용합니다.
title: "Refactor: "
labels: ["Refactor"]
body:
  - type: textarea
    id: refactor-reason
    attributes:
      label: 리팩토링 이유
      placeholder: 현재 코드의 어떤 점이 문제인지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 리팩토링 범위
      placeholder: 수정할 파일/폴더/모듈 범위를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: effect
    attributes:
      label: 기대 효과
      placeholder: 리팩토링 후 기대되는 개선점을 적어주세요.
    validations:
      required: false
