name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python 문법 검사 (ruff)
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82   # 문법 오류·미정의 변수만 (스타일은 강제 안 함)

      - name: Shell 스크립트 문법 검사
        run: |
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -r -n1 bash -n
